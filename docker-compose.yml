services:
  engine-genesis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engine-genesis-node
    restart: unless-stopped
    ports:
      - "8090:8090"  # HTTP / @boundary Web Gateway
      - "5442:5432"  # PostgreSQL Wire Protocol Bridge (engine-bridge)
      - "9443:9443"  # Distributed Causal Mesh Wire Protocol (P2P)
    volumes:
      - ./data:/app/data
      - ./examples:/app/examples
      - ./framework:/app/framework
    environment:
      - ENGINE_ENV=production
      - ENGINE_DB_PATH=/app/data/engine.db
    healthcheck:
      test: ["CMD-SHELL", "enginec inspect /app/data/engine.db || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  framework-test:
    image: engine-lang-engine-genesis
    container_name: engine-framework-test
    restart: unless-stopped
    ports:
      - "8091:8090"  # HTTP / @boundary Web Gateway de Teste
      - "5443:5432"  # PostgreSQL Wire Protocol Bridge de Teste
      - "9444:9443"  # Distributed Causal Mesh Wire Protocol de Teste
    volumes:
      - ./framework:/app/framework
      - ./data:/app/data
    environment:
      - ENGINE_ENV=testing
      - ENGINE_DB_PATH=/app/data/engine_test.db
      - KEEP_ALIVE=true
    entrypoint: ["/app/framework/tests/entrypoint.sh"]

  engine-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: engine-genesis-test
    profiles: ["test"]
    volumes:
      - ./compiler:/build/compiler
      - ./examples:/build/examples
      - ./data:/build/data
    command: ["sh", "-c", "cd /build/compiler && cargo test && cargo run -- check /build/examples/01_hello_causal.eng && cargo run -- check /build/examples/02_persistent_vehicle_fleet.eng && cargo run -- check /build/examples/03_vector_ai_search.eng && cargo run -- check /build/examples/04_causal_blog.eng && cargo run -- run /build/examples/04_causal_blog.eng --db /build/data/engine.db && cargo run -- check /build/examples/05_polyglot_industrial_iot.eng && cargo run -- run /build/examples/05_polyglot_industrial_iot.eng --db /build/data/engine.db && cargo run -- check /build/examples/06_industrial_plc_mmio.eng && cargo run -- run /build/examples/06_industrial_plc_mmio.eng --db /build/data/engine.db && cargo run -- emit-ir /build/examples/06_industrial_plc_mmio.eng"]
