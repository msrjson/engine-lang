[package]
name = "enginec"
version = "0.3.1"
edition = "2021"
authors = ["Engine Lang Core Working Group <architects@engine-lang.org>"]
description = "Reference Bootstrap Compiler and Verification Toolchain for Engine Lang"
license = "Apache-2.0"

[[bin]]
name = "enginec"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
byteorder = "1.5"

[dev-dependencies]
