name: Engine Lang Release Automation

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  build-release-artifacts:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: enginec
            asset_name: enginec-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: enginec
            asset_name: enginec-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: enginec
            asset_name: enginec-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Cross-Compilation Dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Optimized Release Binary
        run: |
          cd compiler
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package Artifact Archive
        run: |
          mkdir -p staging
          cp compiler/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} staging/
          cp LICENSE staging/
          cp README.md staging/
          cp CHANGELOG.md staging/
          cd staging
          tar -czvf ../${{ matrix.asset_name }} *

      - name: Generate SHA-256 Checksum
        run: |
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  publish-github-release:
    name: Publish Production GitHub Release
    needs: build-release-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          sha256sum -c SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Engine Lang ${{ github.ref_name }} (Genesis Alpha)"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
            Engine_Lang_Whitepaper_EN.pdf

