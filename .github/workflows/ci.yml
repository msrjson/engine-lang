name: Engine Lang Core CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  compiler-build-and-verify:
    name: Compiler Build, Test, and Formal SMT Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Engine Lang Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Z3 Theorem Prover
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 libz3-dev

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            compiler/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('compiler/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust Formatting
        run: |
          cd compiler
          cargo fmt --check

      - name: Run Clippy Linter
        run: |
          cd compiler
          cargo clippy -- -D warnings

      - name: Run Compiler Unit & Integration Tests
        run: |
          cd compiler
          cargo test --verbose

      - name: Verify CLI Version & Engineering Diagnostics
        run: |
          cd compiler
          cargo run -- version

      - name: Verify All Canonical Language Examples via enginec check
        run: |
          cd compiler
          for f in ../examples/*.eng; do
            echo "Formal SMT verification for $f"
            cargo run -- check "$f" || exit 1
          done

      - name: Verify Storage Engine Container Initialization & Inspection
        run: |
          cd compiler
          cargo run -- init-db --path /tmp/ci_test.db --size-mib 16
          cargo run -- inspect /tmp/ci_test.db
